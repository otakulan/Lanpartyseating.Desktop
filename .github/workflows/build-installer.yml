# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CREDPROV_VERSION: "1.0.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x64
        - arm64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # Need full history for tags
    - name: Determine Version
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
          $version = $Matches[1]
          $is_release = "true"
        } else {
          [xml]$props = Get-Content "Directory.Build.props"
          $base = $props.Project.PropertyGroup.VersionPrefix
          $version = "$base-dev.${{ github.run_number }}"
          $is_release = "false"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "is_release=$is_release" >> $env:GITHUB_OUTPUT
        echo "Computed version: $version (release: $is_release)"
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}-${{ hashFiles('**/*.wixproj') }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build application
      run: dotnet build --no-restore --verbosity normal Lanpartyseating.Desktop --configuration Release
    - name: Test
      run: dotnet test --no-restore --verbosity normal Lanpartyseating.Desktop.Tests --configuration Release
    - name: Download Credential Provider
      shell: pwsh
      run: |
        $version = "${{ env.CREDPROV_VERSION }}"
        $arch = "${{ matrix.arch }}"
        $url = "https://github.com/otakulan/LanpartySeatingCredProv/releases/download/v$version/RdpCredProv-$version-$arch.zip"
        Invoke-WebRequest -Uri $url -OutFile "credprov.zip"
        Expand-Archive -Path "credprov.zip" -DestinationPath "LanpartySeating.Desktop.Installer/CredProv" -Force
        Remove-Item "credprov.zip"
    - name: Build Installer
      run: dotnet build LanpartySeating.Desktop.Installer/LanpartySeating.Desktop.Installer.wixproj --configuration Release --property:Version=${{ steps.version.outputs.version }} /p:InstallerPlatform=${{ matrix.arch }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LanpartySeating.Desktop.Installer-${{ steps.version.outputs.version }}-${{ matrix.arch }}
        path: |
          LanpartySeating.Desktop.Installer/bin/Release/*.msi
          LanpartySeating.Desktop.Installer/bin/Release/*.wixpdb
    - name: Upload to GitHub Release
      if: steps.version.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: LanpartySeating.Desktop.Installer/bin/Release/*.msi
